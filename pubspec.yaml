name: ios_liquid_glass_effect
description: Native iOS 26 Liquid Glass surfaces and buttons for Flutter, with glass effects on Android, web, and desktop.
version: 0.1.0-alpha.1
homepage: https://www.codemicros.com/
repository: https://github.com/amityamsi/ios_liquid_glass_effect
publish_to: none

topics:
  - liquid-glass
  - ios
  - uikit
  - widgets
  - ui

screenshots:
  - description: Glass surfaces and buttons in the Flutter web example.
    path: doc/media/web-example.png
  - description: The Flutter web example scrolls the backdrop and switches scenes behind the glass controls.
    path: doc/media/web-example-scroll.gif

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  shaders:
    - shaders/glass_refraction.frag
  plugin:
    platforms:
      ios:
        pluginClass: IosLiquidGlassEffectPlugin
